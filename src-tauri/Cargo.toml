[package]
name = "appimage-manager"
version = "0.1.0"
description = "A desktop launcher and manager for AppImage applications"
authors = ["Pedro Lobato"]
edition = "2021"

[lib]
name = "appimage_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
